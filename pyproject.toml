[project]
name = "face-recognition-attendance"
version = "0.1.0"
description = "Django face recognition attendance system"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2,<6.1",
    "whitenoise>=6.9,<7",
    "boto3>=1.34,<2",
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "Pillow>=10,<13",
]

[project.scripts]
app = "api.index:app"

[tool.vercel.scripts]
build = "python manage.py collectstatic --noinput"
